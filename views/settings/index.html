<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>图像工坊设置</title>
    <style>
      :root {
        --bg: #f7f8fa;
        --card: #ffffff;
        --text: #1c1e21;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #4f46e5;
        --accent-hover: #4338ca;
        --danger: #dc2626;
        --ok: #16a34a;
        --input-bg: #ffffff;
      }
      [data-theme="dark"] {
        --bg: #14161a;
        --card: #1d2026;
        --text: #e6e8eb;
        --muted: #9aa1ab;
        --border: #2c313a;
        --accent: #6366f1;
        --accent-hover: #818cf8;
        --danger: #f87171;
        --ok: #4ade80;
        --input-bg: #12141a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.55;
        font-size: 14px;
      }
      .wrap { max-width: 900px; margin: 0 auto; padding: 24px 20px 48px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      .subtitle { color: var(--muted); margin: 0 0 20px; }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px;
        margin-bottom: 16px;
      }
      .card h2 { font-size: 15px; margin: 0 0 14px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .grid .full { grid-column: 1 / -1; }
      .field { display: flex; flex-direction: column; gap: 6px; }
      label { font-size: 12px; color: var(--muted); }
      code {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
        background: var(--border);
        padding: 1px 5px;
        border-radius: 4px;
      }
      input, select, textarea {
        background: var(--input-bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 9px 10px;
        font-size: 14px;
        width: 100%;
      }
      input:focus, select:focus, textarea:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }
      textarea { resize: vertical; min-height: 80px; }
      .key-row { display: flex; gap: 8px; }
      .key-row input { flex: 1; }
      button {
        border: 0;
        border-radius: 8px;
        padding: 9px 14px;
        font-size: 14px;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
        white-space: nowrap;
      }
      button:hover { background: var(--accent-hover); }
      button.secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }
      button.secondary:hover { background: var(--border); }
      button.danger {
        background: transparent;
        color: var(--danger);
        border: 1px solid var(--danger);
      }
      button.danger:hover { background: rgba(220,38,38,.12); }
      button.primary { font-weight: 600; }
      .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .profile-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      .profile-bar select { flex: 1; min-width: 220px; }
      .active-hint { margin-top: 10px; font-size: 12px; color: var(--accent); }
      .hint { font-size: 12px; color: var(--muted); }
      .status { padding: 10px 12px; border-radius: 8px; margin: 12px 0; display: none; }
      .status.ok { display: block; background: rgba(22,163,74,.12); color: var(--ok); }
      .status.err { display: block; background: rgba(220,38,38,.12); color: var(--danger); }
      .status.info { display: block; background: rgba(79,70,229,.12); color: var(--accent); }
      .preview { margin-top: 14px; display: none; }
      .preview.show { display: block; }
      .preview img {
        max-width: 100%;
        max-height: 420px;
        border-radius: 10px;
        border: 1px solid var(--border);
      }
      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        user-select: none;
      }
      .toggle input { width: auto; }
      .actions { display: flex; gap: 10px; margin-top: 18px; align-items: center; flex-wrap: wrap; }
      .model-row { display: flex; gap: 8px; }
      .model-row input { flex: 1; }
      @media (max-width: 640px) {
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>图像工坊设置</h1>
      <p class="subtitle">可添加多个服务商配置，测试通过后保存，并随时切换机器人当前使用的配置。</p>

      <section class="card">
        <h2>配置档案</h2>
        <div class="profile-bar">
          <select id="profileSelect"></select>
          <button id="newProfile" class="secondary" type="button">新建配置</button>
          <button id="activateProfile" class="secondary" type="button">设为当前</button>
          <button id="deleteProfile" class="danger" type="button">删除</button>
        </div>
        <div id="activeHint" class="active-hint"></div>
        <div class="grid" style="margin-top: 14px;">
          <div class="field">
            <label for="profileName">配置名称</label>
            <input id="profileName" placeholder="例如：OpenAI 主号 / Packy 绘图" />
          </div>
          <div class="field" style="justify-content: flex-end;">
            <label class="toggle">
              <input id="set_active" type="checkbox" checked /> 保存后设为当前配置
            </label>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>服务与密钥</h2>
        <div class="grid">
          <div class="field">
            <label for="provider">服务提供商</label>
            <select id="provider"></select>
          </div>
          <div class="field">
            <label for="base_url">Base URL</label>
            <input id="base_url" placeholder="https://api.example.com/v1" />
          </div>
          <div class="field full">
            <label for="api_key">API Key</label>
            <div class="key-row">
              <input id="api_key" type="password" placeholder="sk-..." autocomplete="off" />
              <button id="toggle_key" class="secondary" type="button">显示</button>
            </div>
          </div>
          <div class="field full">
            <label for="model">模型</label>
            <div class="model-row">
              <input id="model" list="modelOptions" placeholder="留空使用默认模型" />
              <button id="detect" class="secondary" type="button">检测可用模型</button>
            </div>
            <datalist id="modelOptions"></datalist>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>生成参数</h2>
        <div class="grid">
          <div class="field">
            <label for="size">图片尺寸</label>
            <select id="size">
              <option value="auto">auto</option>
              <option value="1024x1024">1024x1024</option>
              <option value="1536x1024">1536x1024</option>
              <option value="1024x1536">1024x1536</option>
              <option value="2048x2048">2048x2048</option>
              <option value="2048x1152">2048x1152</option>
              <option value="3840x2160">3840x2160</option>
              <option value="2160x3840">2160x3840</option>
              <option value="768x1024">768x1024</option>
              <option value="1024x768">1024x768</option>
              <option value="512x512">512x512</option>
            </select>
          </div>
          <div class="field">
            <label for="quality">质量</label>
            <select id="quality">
              <option value="auto">auto</option>
              <option value="high">high</option>
              <option value="medium">medium</option>
              <option value="low">low</option>
            </select>
          </div>
          <div class="field">
            <label for="n">生成数量</label>
            <input id="n" type="number" min="1" max="4" step="1" value="1" />
          </div>
          <div class="field">
            <label for="response_format">返回格式</label>
            <select id="response_format">
              <option value="b64_json">b64_json</option>
              <option value="url">url</option>
            </select>
          </div>
          <div class="field full">
            <label class="toggle">
              <input id="stream" type="checkbox" /> 启用 SSE 流式返回
            </label>
            <span class="hint">apikey.fan 的 gpt-image-2 建议开启；Packy 不支持流式。</span>
          </div>
        </div>

        <details style="margin-top: 14px;">
          <summary style="cursor: pointer; color: var(--muted); font-size: 12px;">高级参数</summary>
          <div class="grid" style="margin-top: 12px;">
            <div class="field">
              <label for="t2i_path">文生图路径</label>
              <input id="t2i_path" value="/images/generations" />
            </div>
            <div class="field">
              <label for="i2i_path">图生图路径</label>
              <input id="i2i_path" value="/images/edits" />
            </div>
            <div class="field">
              <label for="output_format">输出格式（Packy / GPT-Image）</label>
              <select id="output_format">
                <option value="png">png</option>
                <option value="jpeg">jpeg</option>
                <option value="webp">webp</option>
              </select>
            </div>
            <div class="field">
              <label for="output_compression">JPEG 压缩质量（0-100）</label>
              <input id="output_compression" type="number" min="0" max="100" step="1" value="90" />
              <span class="hint">仅 output_format=jpeg 时生效。</span>
            </div>
            <div class="field full">
              <label for="timeout">超时（秒）</label>
              <input id="timeout" type="number" min="10" max="900" step="10" value="300" />
            </div>
          </div>
        </details>
      </section>

      <section class="card">
        <h2>测试当前表单</h2>
        <div class="row">
          <label class="toggle"><input type="radio" name="mode" value="text" checked /> 文生图</label>
          <label class="toggle"><input type="radio" name="mode" value="image" /> 图生图</label>
        </div>
        <div class="field" style="margin-top: 12px;">
          <label for="prompt">测试 Prompt</label>
          <textarea id="prompt" placeholder="例如：生成一只太空猫"></textarea>
        </div>
        <div class="field" id="imageField" style="margin-top: 12px; display: none;">
          <label for="refImage">参考图片</label>
          <input id="refImage" type="file" accept="image/*" />
        </div>
        <div class="row" style="margin-top: 12px;">
          <button id="run_test" class="primary" type="button">开始测试</button>
          <span class="hint">测试使用当前表单，不会自动保存。</span>
        </div>
        <div id="status" class="status"></div>
        <div id="preview" class="preview"></div>
      </section>

      <section class="card">
        <h2>SVG 绘图（本地渲染）</h2>
        <p class="hint" style="margin-top:-4px;">
          用 SVG 代码绘制图表、示意图、图标和海报，由本机渲染成 PNG，不调用图像模型。
          聊天中可用 <code>/svg绘图</code>，AI 可调用 <code>svg_render</code>。
        </p>
        <div class="field" style="margin-top:12px;">
          <label for="svgSource">SVG 代码</label>
          <textarea id="svgSource" spellcheck="false"
            style="min-height:170px; font-family: ui-monospace, Consolas, monospace; font-size:12px;"></textarea>
        </div>
        <div class="grid" style="margin-top:12px;">
          <div class="field">
            <label for="svg_width">默认宽度（0=自动）</label>
            <input id="svg_width" type="number" min="0" max="8192" step="1" value="0" />
          </div>
          <div class="field">
            <label for="svg_height">默认高度（0=自动）</label>
            <input id="svg_height" type="number" min="0" max="8192" step="1" value="0" />
          </div>
          <div class="field">
            <label for="svg_background">背景色</label>
            <input id="svg_background" value="#ffffff" placeholder="#ffffff 或 transparent" />
          </div>
          <div class="field">
            <label for="svg_max_dimension">最大边长</label>
            <input id="svg_max_dimension" type="number" min="64" max="8192" step="64" value="4096" />
          </div>
        </div>
        <div class="row" style="margin-top:12px;">
          <button id="render_svg" class="primary" type="button">渲染预览</button>
          <button id="fill_sample" class="secondary" type="button">填入示例</button>
          <span class="hint" id="svgHint"></span>
        </div>
        <div id="svgPreview" class="preview"></div>
      </section>

      <section class="card">
        <h2>插件行为</h2>
        <div class="grid">
          <div class="field">
            <label class="toggle"><input id="allow_commands" type="checkbox" checked /> 启用 /文生图、/图生图 指令</label>
          </div>
          <div class="field">
            <label class="toggle"><input id="register_llm_tools" type="checkbox" checked /> 向 AI 注册文生图/图生图工具</label>
          </div>
        </div>
        <div class="actions">
          <button id="save" class="primary" type="button">保存配置</button>
          <span class="hint" id="saveHint"></span>
        </div>
      </section>
    </div>

    <script type="module">
      const bridge = window.AstrBotPluginView;
      await bridge.ready();

      const $ = (id) => document.getElementById(id);
      const status = $("status");
      const preview = $("preview");

      let providers = [];
      let profiles = [];
      let activeId = "";
      let editingId = "";

      function setStatus(msg, type) {
        status.className = "status " + type;
        status.textContent = msg;
      }
      function clearStatus() {
        status.className = "status";
        status.textContent = "";
      }

      function currentProvider() {
        return providers.find((x) => x.id === $("provider").value) || {};
      }

      function fillModelOptions(models) {
        const dl = $("modelOptions");
        dl.innerHTML = "";
        for (const m of models || []) {
          const opt = document.createElement("option");
          opt.value = m;
          dl.appendChild(opt);
        }
      }

      function syncCapabilityUi() {
        const p = currentProvider();
        const maxN = p.max_n || 4;
        $("n").max = String(maxN);
        if ((parseInt($("n").value, 10) || 1) > maxN) {
          $("n").value = String(maxN);
        }
        const supportsStream = p.supports_stream !== false;
        $("stream").disabled = !supportsStream;
        if (!supportsStream) $("stream").checked = false;
        const supportsOutput = !!p.supports_output_format;
        $("output_format").disabled = !supportsOutput;
        $("output_compression").disabled =
          !supportsOutput || $("output_format").value !== "jpeg";
      }

      function onProviderChange() {
        const p = currentProvider();
        if (!p.id) return;
        $("base_url").value = p.base_url || "";
        $("model").value = p.default_model || "";
        $("stream").checked = !!p.stream;
        if (p.default_size) $("size").value = p.default_size;
        fillModelOptions(p.models || []);
        syncCapabilityUi();
      }

      function renderProfileSelect() {
        const sel = $("profileSelect");
        sel.innerHTML = "";
        if (!editingId) {
          const opt = document.createElement("option");
          opt.value = "__new__";
          opt.textContent = "新配置（未保存）";
          sel.appendChild(opt);
        }
        for (const p of profiles) {
          const opt = document.createElement("option");
          opt.value = p.id;
          opt.textContent = (p.name || p.id) + (p.id === activeId ? " · 当前" : "");
          sel.appendChild(opt);
        }
        sel.value = editingId || "__new__";
        const active = profiles.find((p) => p.id === activeId);
        $("activeHint").textContent = active
          ? "机器人当前使用：" + (active.name || active.id)
          : "机器人当前使用：未设置";
      }

      function defaultProfile() {
        const p = providers.find((x) => x.id === "openai") || {};
        return {
          id: "",
          name: "",
          provider: "openai",
          base_url: p.base_url || "https://api.openai.com/v1",
          api_key: "",
          model: p.default_model || "gpt-image-1",
          size: p.default_size || "1024x1024",
          quality: "auto",
          n: 1,
          stream: !!p.stream,
          response_format: "b64_json",
          output_format: "png",
          output_compression: 90,
          t2i_path: "/images/generations",
          i2i_path: "/images/edits",
          timeout: 300,
        };
      }

      function loadIntoForm(p) {
        const profile = p || defaultProfile();
        $("profileName").value = profile.name || "";
        $("provider").value = profile.provider || "openai";
        $("base_url").value = profile.base_url || "";
        $("api_key").value = profile.api_key || "";
        $("model").value = profile.model || "";
        $("size").value = profile.size || "1024x1024";
        $("quality").value = profile.quality || "auto";
        $("n").value = profile.n || 1;
        $("stream").checked = !!profile.stream;
        $("response_format").value = profile.response_format || "b64_json";
        $("output_format").value = profile.output_format || "png";
        $("output_compression").value =
          profile.output_compression === undefined ? 90 : profile.output_compression;
        $("t2i_path").value = profile.t2i_path || "/images/generations";
        $("i2i_path").value = profile.i2i_path || "/images/edits";
        $("timeout").value = profile.timeout || 300;
        fillModelOptions(currentProvider().models || []);
        syncCapabilityUi();
      }

      function collectProfile() {
        return {
          id: editingId || undefined,
          name: $("profileName").value.trim() || "未命名配置",
          provider: $("provider").value,
          base_url: $("base_url").value.trim(),
          api_key: $("api_key").value.trim(),
          model: $("model").value.trim(),
          size: $("size").value,
          quality: $("quality").value,
          n: parseInt($("n").value, 10) || 1,
          stream: $("stream").checked,
          response_format: $("response_format").value,
          output_format: $("output_format").value,
          output_compression: parseInt($("output_compression").value, 10) || 0,
          t2i_path: $("t2i_path").value.trim() || "/images/generations",
          i2i_path: $("i2i_path").value.trim() || "/images/edits",
          timeout: parseInt($("timeout").value, 10) || 300,
        };
      }

      function applyProfilesResult(res, preferredId) {
        profiles = res.profiles || profiles;
        activeId = res.active_id || activeId;
        editingId = preferredId || activeId;
        renderProfileSelect();
        const p = profiles.find((x) => x.id === editingId);
        if (p) loadIntoForm(p);
      }

      document.querySelectorAll('input[name="mode"]').forEach((r) => {
        r.addEventListener("change", () => {
          $("imageField").style.display = r.value === "image" ? "flex" : "none";
        });
      });

      $("profileSelect").addEventListener("change", () => {
        const value = $("profileSelect").value;
        if (value === "__new__") {
          editingId = "";
          loadIntoForm(defaultProfile());
          renderProfileSelect();
          return;
        }
        const p = profiles.find((x) => x.id === value);
        if (p) {
          editingId = p.id;
          loadIntoForm(p);
          renderProfileSelect();
        }
      });

      $("newProfile").addEventListener("click", () => {
        editingId = "";
        loadIntoForm(defaultProfile());
        renderProfileSelect();
      });

      $("provider").addEventListener("change", onProviderChange);
      $("toggle_key").addEventListener("click", () => {
        const inp = $("api_key");
        const show = inp.type === "password";
        inp.type = show ? "text" : "password";
        $("toggle_key").textContent = show ? "隐藏" : "显示";
      });
      $("output_format").addEventListener("change", () => {
        $("output_compression").disabled =
          $("output_format").disabled || $("output_format").value !== "jpeg";
      });

      $("detect").addEventListener("click", async () => {
        const base_url = $("base_url").value.trim();
        if (!base_url) {
          setStatus("请先填写 Base URL", "err");
          return;
        }
        setStatus("正在检测可用模型…", "info");
        try {
          const res = await bridge.apiPost("models", {
            base_url,
            api_key: $("api_key").value.trim(),
            timeout: parseInt($("timeout").value, 10) || 60,
          });
          const models = res.models || [];
          fillModelOptions(models);
          if (!$("model").value && models.length) {
            $("model").value = models[0];
          }
          setStatus("检测到 " + models.length + " 个模型", "ok");
        } catch (e) {
          setStatus("检测失败：" + (e.message || e), "err");
        }
      });

      $("run_test").addEventListener("click", async () => {
        clearStatus();
        preview.className = "preview";
        preview.innerHTML = "";
        const mode = document.querySelector('input[name="mode"]:checked').value;
        const prompt = $("prompt").value.trim();
        if (!prompt) {
          setStatus("请先填写测试 Prompt", "err");
          return;
        }
        const body = collectProfile();
        body.mode = mode;
        body.prompt = prompt;
        if (mode === "image") {
          const file = $("refImage").files && $("refImage").files[0];
          if (!file) {
            setStatus("请先选择参考图片", "err");
            return;
          }
          body.image_b64 = await fileToBase64(file);
        }
        setStatus("正在生成，请稍候…", "info");
        try {
          const res = await bridge.apiPost("profiles/test", body);
          const images = res.images || [];
          if (!images.length) {
            setStatus("接口未返回图片", "err");
            return;
          }
          preview.className = "preview show";
          for (const img of images) {
            if (img.b64) {
              const mime = img.mime || "image/png";
              const el = document.createElement("img");
              el.src = "data:" + mime + ";base64," + img.b64;
              preview.appendChild(el);
            } else if (img.url) {
              const el = document.createElement("img");
              el.src = img.url;
              preview.appendChild(el);
            }
          }
          setStatus("测试成功，可以保存配置。", "ok");
        } catch (e) {
          setStatus("测试失败：" + (e.message || e), "err");
        }
      });

      $("save").addEventListener("click", async () => {
        clearStatus();
        $("saveHint").textContent = "";
        const body = collectProfile();
        body.set_active = $("set_active").checked;
        try {
          const res = await bridge.apiPost("profiles/save", body);
          await bridge.apiPost("config/save", {
            allow_commands: $("allow_commands").checked,
            register_llm_tools: $("register_llm_tools").checked,
            svg_width: parseInt($("svg_width").value, 10) || 0,
            svg_height: parseInt($("svg_height").value, 10) || 0,
            svg_background: $("svg_background").value.trim() || "#ffffff",
            svg_max_dimension: parseInt($("svg_max_dimension").value, 10) || 4096,
          });
          applyProfilesResult(res, res.saved_id);
          $("saveHint").textContent = "已保存";
          setStatus(
            res.active_id === res.saved_id
              ? "配置已保存，并设为当前使用。"
              : "配置已保存。",
            "ok"
          );
        } catch (e) {
          setStatus("保存失败：" + (e.message || e), "err");
        }
      });

      $("activateProfile").addEventListener("click", async () => {
        clearStatus();
        if (!editingId) {
          setStatus("新配置尚未保存，请先保存再设为当前。", "err");
          return;
        }
        try {
          const res = await bridge.apiPost("profiles/activate", { id: editingId });
          profiles = res.profiles || profiles;
          activeId = res.active_id;
          renderProfileSelect();
          setStatus("已切换机器人当前使用的配置。", "ok");
        } catch (e) {
          setStatus("切换失败：" + (e.message || e), "err");
        }
      });

      $("deleteProfile").addEventListener("click", async () => {
        clearStatus();
        if (!editingId) {
          setStatus("新配置尚未保存，无需删除。", "err");
          return;
        }
        if (!confirm("确定删除当前配置档案？")) return;
        try {
          const res = await bridge.apiPost("profiles/delete", { id: editingId });
          profiles = res.profiles || [];
          activeId = res.active_id || "";
          editingId = activeId;
          renderProfileSelect();
          const p = profiles.find((x) => x.id === editingId);
          if (p) loadIntoForm(p);
          setStatus("配置已删除。", "ok");
        } catch (e) {
          setStatus("删除失败：" + (e.message || e), "err");
        }
      });

      function fileToBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error);
          reader.readAsDataURL(file);
        });
      }

      const SAMPLE_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <rect width="800" height="480" rx="24" fill="#eef2ff"/>
  <circle cx="650" cy="120" r="70" fill="#4f46e5" opacity="0.2"/>
  <text x="60" y="180" fill="#1e1b4b" font-family="sans-serif" font-size="54" font-weight="700">SVG 绘图</text>
  <text x="62" y="230" fill="#4f46e5" font-family="sans-serif" font-size="24">本地渲染 · 无需 AI 图片模型</text>
  <rect x="60" y="290" width="680" height="12" rx="6" fill="#c7d2fe"/>
  <rect x="60" y="320" width="480" height="12" rx="6" fill="#a5b4fc"/>
  <rect x="60" y="350" width="300" height="12" rx="6" fill="#818cf8"/>
</svg>`;

      function fillSvgSample() {
        $("svgSource").value = SAMPLE_SVG;
      }

      async function renderSvgPreview() {
        const svg = $("svgSource").value.trim();
        if (!svg) {
          $("svgHint").textContent = "请先填写 SVG 代码";
          return;
        }
        $("svgHint").textContent = "正在渲染…";
        $("svgPreview").className = "preview";
        $("svgPreview").innerHTML = "";
        try {
          const res = await bridge.apiPost("svg/render", {
            svg,
            width: parseInt($("svg_width").value, 10) || 0,
            height: parseInt($("svg_height").value, 10) || 0,
            background: $("svg_background").value.trim() || "#ffffff",
            max_dimension: parseInt($("svg_max_dimension").value, 10) || 4096,
          });
          const el = document.createElement("img");
          el.src = "data:" + (res.mime || "image/png") + ";base64," + res.b64;
          $("svgPreview").className = "preview show";
          $("svgPreview").appendChild(el);
          $("svgHint").textContent = "渲染成功：" + res.width + "×" + res.height;
        } catch (e) {
          $("svgHint").textContent = "渲染失败：" + (e.message || e);
        }
      }

      $("fill_sample").addEventListener("click", fillSvgSample);
      $("render_svg").addEventListener("click", renderSvgPreview);

      try {
        const [pRes, profilesRes, configRes] = await Promise.all([
          bridge.apiGet("providers"),
          bridge.apiGet("profiles"),
          bridge.apiGet("config"),
        ]);
        providers = pRes.providers || [];
        const select = $("provider");
        for (const p of providers) {
          const opt = document.createElement("option");
          opt.value = p.id;
          opt.textContent = p.name;
          select.appendChild(opt);
        }
        profiles = profilesRes.profiles || [];
        activeId = profilesRes.active_id || "";
        editingId = activeId;
        renderProfileSelect();
        const current = profiles.find((x) => x.id === editingId) || defaultProfile();
        loadIntoForm(current);
        const cfg = configRes.config || {};
        $("allow_commands").checked = cfg.allow_commands !== false;
        $("register_llm_tools").checked = cfg.register_llm_tools !== false;
        $("svg_width").value = cfg.svg_width || 0;
        $("svg_height").value = cfg.svg_height || 0;
        $("svg_background").value = cfg.svg_background || "#ffffff";
        $("svg_max_dimension").value = cfg.svg_max_dimension || 4096;
        fillSvgSample();
      } catch (e) {
        setStatus("加载配置失败：" + (e.message || e), "err");
      }
    </script>
  </body>
</html>
